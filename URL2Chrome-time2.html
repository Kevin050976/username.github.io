<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>載入中...</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #000; color: white; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        #video-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; flex-shrink: 0; z-index: 10; display: flex; justify-content: center; align-items: center; }
        #yt-player { width: 100%; height: 100%; border: none; max-width: 640px; max-height: 360px; }
        #info-section { flex-grow: 1; padding: 15px; padding-bottom: 110px; background: #111; overflow-y: auto; }
        #vid-title { margin: 0 0 5px 0; font-size: 18px; line-height: 1.3; }
        #vid-channel { margin: 0 0 15px 0; font-size: 14px; color: #aaa; }
        #vid-desc { background: #222; padding: 12px; border-radius: 8px; font-size: 14px; color: #ccc; line-height: 1.5; white-space: pre-wrap; }
        #controls { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; height: 90px; background: #1c1c1e; box-sizing: border-box; padding: 0 15px; padding-bottom: env(safe-area-inset-bottom); gap: 15px; z-index: 100; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        button { flex: 1; height: 55px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 12px; background: #0a84ff; color: white; touch-action: manipulation; }
        button:active { background: #0060d1; }
        button:disabled { background: #3a3a3c; color: #8e8e93; cursor: not-allowed; }
        #skip-time { font-size: 16px; font-weight: bold; color: white; background: #3a3a3c; border: none; border-radius: 8px; padding: 0 10px; height: 55px; text-align: center; outline: none; cursor: pointer; flex-shrink: 0; min-width: 95px;}
    </style>
</head>
<body>
    <div id="video-wrapper">
        <div id="yt-player"></div>
    </div>
    
    <div id="info-section">
        <h3 id="vid-title">等待載入...</h3>
        <p id="vid-channel"></p>
        <div id="vid-desc"></div>
    </div>

    <div id="controls">
        <button id="rewind-btn" onclick="skipTime(-1)">◄ 倒轉</button>
        <select id="skip-time">
            <option value="30">30 秒</option>
            <option value="60" selected>1 分鐘</option>
            <option value="120">2 分鐘</option>
            <option value="180">3 分鐘</option>
            <option value="300">5 分鐘</option>
            <option value="600">10 分鐘</option>
        </select>
        <button id="forward-btn" onclick="skipTime(1)">快轉 ►</button>
    </div>

    <script>
        const API_KEY = 'AIzaSyCD8fnx7T0aEpPG2Co5p4QDqshIgB_ix1Y'; 

        let videoIds = [];
        let currentIndex = 0;
        let player;
        let progressInterval;
        let initialStartSeconds = 0;

        function parseYTTime(urlStr) {
            let match = urlStr.match(/(?:t=|time_continue=)([\dhms]+)/);
            if (!match) return 0;
            let timeStr = match[1];
            if (/^\d+s?$/.test(timeStr)) {
                return parseInt(timeStr);
            }
            let hours = timeStr.match(/(\d+)h/);
            let minutes = timeStr.match(/(\d+)m/);
            let seconds = timeStr.match(/(\d+)s/);
            let total = 0;
            if (hours) total += parseInt(hours[1]) * 3600;
            if (minutes) total += parseInt(minutes[1]) * 60;
            if (seconds) total += parseInt(seconds[1]);
            return total;
        }

        function cleanUrlTimeParameter() {
            let currentUrl = new URL(window.location.href);
            let textParam = currentUrl.searchParams.get('text');
            if (textParam && (textParam.includes('t=') || textParam.includes('time_continue='))) {
                let cleanText = textParam.replace(/(?:&|\?)t=[\dhms]+/, '').replace(/(?:&|\?)time_continue=[\dhms]+/, '');
                currentUrl.searchParams.set('text', cleanText);
                window.history.replaceState(null, '', currentUrl.toString());
            }
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawText = urlParams.get('text');    

            if (rawText) {
                const rawTextDecoded = decodeURIComponent(rawText);
                
                let externalTime = parseYTTime(rawTextDecoded);

                const regExp = /(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|live\/|shorts\/)([a-zA-Z0-9_-]{11})/g;
                const matches = [...rawTextDecoded.matchAll(regExp)];
                videoIds = matches.map(match => match[1]);
                videoIds = [...new Set(videoIds)];

                if (videoIds.length > 0) {
                    const currentVid = videoIds[0];
                    
                    if (externalTime > 0) {
                        initialStartSeconds = externalTime;
                        localStorage.setItem('yt_progress_' + currentVid, externalTime);
                        cleanUrlTimeParameter();
                    } else {
                        let savedTime = localStorage.getItem('yt_progress_' + currentVid);
                        initialStartSeconds = savedTime ? parseFloat(savedTime) : 0;
                    }

                    const tag = document.createElement('script');
                    tag.src = "https://www.youtube.com/iframe_api";
                    const firstScriptTag = document.getElementsByTagName('script')[0];
                    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                } else {
                    showError('找不到 YouTube 影片');
                }
            } else {
                showError('請透過捷徑傳入網址');
            }
        }

        function showError(titleText) {
            document.getElementById('vid-title').innerText = titleText;
        }

        window.onYouTubeIframeAPIReady = function() {
            const currentVid = videoIds[currentIndex];

            player = new YT.Player('yt-player', {
                height: '360',
                width: '640',
                videoId: currentVid,
                playerVars: {
                    'playsinline': 1, 
                    'vq': 'small',    
                    'start': Math.floor(initialStartSeconds) 
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            updateUIAndFetchMetadata();
        }

        function onPlayerStateChange(event) {
            const currentVid = videoIds[currentIndex];
            
            if (event.data == YT.PlayerState.PLAYING) {
                event.target.setPlaybackQuality('small');

                clearInterval(progressInterval);
                progressInterval = setInterval(() => {
                    let currentTime = player.getCurrentTime();
                    if (currentTime > 0) {
                        localStorage.setItem('yt_progress_' + currentVid, currentTime);
                    }
                }, 3000);

            } else {
                clearInterval(progressInterval);
                
                if (event.data == YT.PlayerState.PAUSED) {
                    localStorage.setItem('yt_progress_' + currentVid, player.getCurrentTime());
                }
                
                if (event.data == YT.PlayerState.ENDED) {
                    localStorage.removeItem('yt_progress_' + currentVid);
                }
            }
        }

        function updateUIAndFetchMetadata() {
            const currentVideoId = videoIds[currentIndex];
            
            document.getElementById('vid-title').innerText = '載入影片資訊中...';
            document.getElementById('vid-channel').innerText = '';
            document.getElementById('vid-desc').innerText = '抓取內文中...';

            const apiUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${currentVideoId}&key=${API_KEY}`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.items && data.items.length > 0) {
                        const snippet = data.items[0].snippet;
                        const fullTitle = snippet.title;
                        
                        document.getElementById('vid-title').innerText = fullTitle;
                        document.getElementById('vid-channel').innerText = snippet.channelTitle;
                        document.getElementById('vid-desc').innerText = snippet.description ? snippet.description : '（此影片無提供內文）';
                        
                        document.title = fullTitle.length > 10 ? fullTitle.substring(0, 10) + '...' : fullTitle;
                    }
                })
                .catch(error => console.error("API 請求錯誤: ", error));
        }

        function skipTime(direction) {
            if (player && typeof player.getCurrentTime === 'function') {
                const skipSelect = document.getElementById('skip-time');
                const skipSeconds = parseInt(skipSelect.value, 10);
                const currentTime = player.getCurrentTime();
                
                player.seekTo(currentTime + (direction * skipSeconds), true);
                
                player.playVideo();
            }
        }

        init();
    </script>
</body>
</html>

進入全螢幕。要解決這個問題，必須將 YouTube IFrame API 參數中的 playsinline 數值從 0 改為 1，強制影片在網頁內嵌（Inline）播放，這樣您就能連續點擊按鈕了。
