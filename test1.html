<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開啟 Roomcord</title>
    <style>
        /* 讓畫面內容置中，並設定簡單的背景 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 按鈕樣式設計 (仿 iOS 風格) */
        .app-btn {
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background-color: #007AFF;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        /* 按下按鈕時的回饋效果 */
        .app-btn:active {
            background-color: #005bb5;
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- 點擊按鈕後觸發 JavaScript 更改網址，喚醒 App -->
    <button class="app-btn" onclick="openRoomcord()">開啟 Roomcord</button>

    <script>
        function openRoomcord() {
            // 在此填入 Roomcord 專屬的 URL Scheme
            window.location.href = "roomcord://";
        }
    </script>

</body>
</html>
