<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 針對手機螢幕最佳化，防止載入時縮放比例異常 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini 捷徑傳送門</title>
    <style>
        /* 基礎排版與背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e1e; /* 護眼的深色背景 */
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 大大的輸入框 */
        textarea {
            width: 100%;
            max-width: 600px;
            height: 45vh; /* 佔據螢幕約 45% 的高度 */
            background-color: #2d2d2d;
            color: #ffffff;
            font-size: 18px;
            padding: 15px;
            border: 2px solid #555;
            border-radius: 12px;
            box-sizing: border-box;
            resize: none; /* 禁用手動拉伸 */
            margin-top: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        textarea:focus {
            outline: none;
            border-color: #8ab4f8; /* 聚焦時變色 */
        }

        /* 下方的小按鍵 */
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #4285f4; /* Google 藍色 */
            border: none;
            border-radius: 20px; /* 圓角膠囊按鈕 */
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #3367d6; /* 按下時的顏色變化 */
            transform: scale(0.96); /* 按下時微縮效果 */
        }
    </style>
</head>
<body>

    <h2 style="margin: 5px 0;">準備問 Gemini：</h2>
    
    <textarea id="myInput" placeholder="請在此輸入內容..."></textarea>
    
    <button onclick="copyAndJump()">複製並開啟捷徑</button>

    <script>
        function copyAndJump() {
            const textArea = document.getElementById('myInput');
            const textToCopy = textArea.value;

            // 檢查是否為空，避免誤觸
            if (!textToCopy.trim()) {
                alert("請先輸入文字再點擊！");
                return;
            }

            // 使用 Clipboard API 寫入剪貼簿 (注意：此 API 需要在 HTTPS 環境下才能執行，GitHub Pages 剛好符合)
            navigator.clipboard.writeText(textToCopy).then(() => {
                
                // 複製成功後，呼叫 iOS 系統捷徑
                // ⚠️ 這裡的 name=OpenGemini 必須與你在 iPhone 捷徑 App 中設定的名字一字不差
                window.location.href = "shortcuts://run-shortcut?name=OpenGemini";
                
                // (選擇性) 延遲一小段時間清空輸入框，方便下次使用
                setTimeout(() => {
                    textArea.value = "";
                }, 1000);

            }).catch(err => {
                console.error('複製失敗：', err);
                alert("無法複製文字，請檢查瀏覽器權限。");
            });
        }
    </script>
</body>
</html>
