<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNG 資產盤點系統 v10.0</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { 
            margin: 0; padding: 0; font-family: -apple-system, sans-serif; 
            background: #000; display: flex; flex-direction: column; 
            height: 100dvh; color: white; overflow: hidden; 
        }
        
        #mode-switch-bar {
            display: flex; background: #222; padding: 10px; gap: 8px; align-items: center;
        }
        .mode-btn {
            flex: 1; padding: 12px; font-size: 16px; font-weight: bold;
            border: none; border-radius: 8px; background: #444; color: white;
        }
        .mode-btn.active { background: #1a73e8; }
        #btn-settings {
            padding: 12px; background: #555; color: white; border: none; 
            border-radius: 8px; font-size: 16px; cursor: pointer;
        }
        #btn-settings:active { background: #777; }

        #scan-container { 
            flex: 1; display: flex; flex-direction: column; min-height: 0; 
        }
        #camera-section { 
            flex: 1; position: relative; overflow: hidden; background: #111; 
            display: flex; align-items: center; justify-content: center; min-height: 0;
        }
        #reader { width: 100%; border: none; }
        #status-bar { 
            position: absolute; top: 10px; left: 10px; right: 10px; 
            background: rgba(0,0,0,0.8); color: #fff; padding: 10px; 
            text-align: center; border-radius: 8px; z-index: 10; font-size: 14px; 
        }
        #info-section { 
            flex: 1; background: #f8f9fa; color: #333; padding: 20px; box-sizing: border-box; 
            overflow-y: auto; -webkit-overflow-scrolling: touch; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; 
            border-top: 4px solid #1a73e8; transition: background-color 0.2s ease;
        }
        
        #manual-container {
            flex: 1; display: none; flex-direction: column; background: #111; min-height: 0; 
        }
        #manual-input-section {
            display: flex; flex-direction: column; background: #222; border-bottom: 4px solid #1a73e8;
            flex-shrink: 0; 
        }
        #manual-display {
            font-size: 26px; font-weight: bold; font-family: monospace;
            text-align: center; padding: 10px; color: #fff; letter-spacing: 2px;
            min-height: 30px; background: #111; margin: 10px; border-radius: 8px;
            border: 2px solid #555;
        }
        .display-placeholder { color: #666; font-size: 16px; line-height: 30px; letter-spacing: normal; }
        #custom-keyboard {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 10px 10px 10px;
        }
        .key {
            background: #444; color: white; font-size: 22px; font-weight: bold;
            padding: 10px 0; text-align: center; border-radius: 8px; user-select: none; cursor: pointer;
        }
        .key:active { background: #666; }
        .key-confirm { background: #1a73e8; font-size: 18px;}
        .key-confirm:active { background: #1557b0; }
        .key-delete { background: #d32f2f; font-size: 18px;}
        .key-delete:active { background: #9a0007; }

        #manual-results-section {
            flex: 1; background: #f8f9fa; color: #333; overflow-y: auto; -webkit-overflow-scrolling: touch; 
            padding: 15px; box-sizing: border-box; min-height: 0; 
        }
        .list-item {
            background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #1a73e8;
        }
        .list-item:active { background: #e8f0fe; }
        .list-id { font-family: monospace; color: #666; font-size: 14px; margin-bottom: 5px; }
        .list-name { font-size: 18px; font-weight: bold; color: #333; }
        
        .asset-img-container { width: 100%; max-height: 200px; display: flex; justify-content: center; margin-bottom: 15px; }
        .asset-img-container img { max-width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .asset-id { font-size: 16px; color: #666; margin-bottom: 5px; font-family: monospace; }
        .asset-name { font-size: 24px; font-weight: bold; color: #1a73e8; text-align: center; line-height: 1.3; }
        .asset-location { font-size: 16px; color: #00796b; margin-top: 5px; font-weight: bold; text-align: center;}
        
        .error-msg { color: #d32f2f; font-size: 20px; font-weight: bold; text-align: center; margin-top: 20px; }
        .hint-msg { color: #888; font-size: 16px; text-align: center; margin-top: 20px; }
        .success-flash { background-color: #d4edda !important; }

        .action-btn-group {
            display: flex; gap: 8px; margin-top: 20px; width: 100%; max-width: 400px;
        }
        .action-btn {
            flex: 1; padding: 12px 2px; font-size: 13px; font-weight: bold; color: white;
            border: none; border-radius: 8px; cursor: pointer; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .action-btn:active { opacity: 0.8; }
        .btn-roomcord { background: #607d8b; } 
        .btn-check { background: #4caf50; }
        .btn-clear { background: #d32f2f; }
        .btn-disabled { opacity: 0.5; cursor: not-allowed !important; }

        .overlay-modal {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-box {
            background: #222; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column;
            max-height: 90vh; overflow-y: auto; 
        }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #fff; flex-shrink: 0;}
        .modal-label { font-size: 14px; color: #ccc; margin-bottom: 5px; display: block; flex-shrink: 0;}
        .modal-input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px;
            border: 1px solid #555; background: #111; color: #fff; box-sizing: border-box; flex-shrink: 0;
        }
        .modal-btn-group { display: flex; gap: 10px; margin-top: 10px; flex-shrink: 0;}
        .btn-save { flex: 2; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;}
        .btn-cancel { flex: 1; padding: 12px; background: #555; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;}
        
    </style>
</head>
<body>

    <div id="mode-switch-bar">
        <button id="btn-scan" class="mode-btn active" onclick="switchMode('scan')">📷 掃描模式</button>
        <button id="btn-manual" class="mode-btn" onclick="switchMode('manual')">⌨️ 手 ক্যামের</button>
        <button id="btn-settings" onclick="openSettings()">⚙️</button>
    </div>

    <div id="scan-container">
        <div id="camera-section">
            <div id="status-bar">請先點擊右上角 ⚙️ 設定系統</div>
            <div id="reader"></div>
        </div>
        <div id="info-section">
            <div style="margin-top: 60px; color: #aaa; font-size: 18px;">系統就緒 (v10.0)</div>
        </div>
    </div>

    <div id="manual-container">
        <div id="manual-input-section">
            <div id="manual-display"><span class="display-placeholder">請輸入資產編號 (12碼)</span></div>
            <div id="custom-keyboard">
                <div class="key" onclick="pressKey('1')">1</div>
                <div class="key" onclick="pressKey('2')">2</div>
                <div class="key" onclick="pressKey('3')">3</div>
                <div class="key" onclick="pressKey('4')">4</div>
                <div class="key" onclick="pressKey('5')">5</div>
                <div class="key" onclick="pressKey('6')">6</div>
                <div class="key" onclick="pressKey('7')">7</div>
                <div class="key" onclick="pressKey('8')">8</div>
                <div class="key" onclick="pressKey('9')">9</div>
                <div class="key key-delete" onclick="pressKey('delete')">刪除</div>
                <div class="key" onclick="pressKey('0')">0</div>
                <div class="key key-confirm" onclick="pressKey('confirm')">確認</div>
            </div>
        </div>
        <div id="manual-results-section">
            <div class="hint-msg">輸入前 4 碼開始篩選</div>
        </div>
    </div>

    <div id="settings-modal" class="overlay-modal">
        <div class="modal-box">
            <div class="modal-title">⚙️ 系統設定 (v10.0)</div>
            
            <label class="modal-label">Apps Script API 網址</label>
            <input type="text" id="script-url-input" class="modal-input" placeholder="https://script.google.com/macros/s/.../exec">

            <label class="modal-label" style="margin-top: 10px;">Roomcord 的房間連結</label>
            <input type="text" id="roomcord-url-input" class="modal-input" placeholder="例如：https://app.roomcord.com/...">

            <div class="modal-btn-group">
                <button class="btn-cancel" onclick="closeSettings()">取消</button>
                <button class="btn-save" onclick="saveSettings()">儲存並連線</button>
            </div>
        </div>
    </div>

    <div id="msg-modal" class="overlay-modal" style="z-index: 999;">
        <div class="modal-box" style="text-align: center; max-width: 300px;">
            <div class="modal-title" id="msg-title">提示</div>
            <div id="msg-content" style="color: #ddd; font-size: 15px; margin-bottom: 20px; line-height: 1.5; text-align: left;"></div>
            <button class="btn-save" style="width: 100%;" onclick="closeMessage()">確定</button>
        </div>
    </div>

    <script>
        const statusBar = document.getElementById('status-bar');
        const infoSection = document.getElementById('info-section');
        const manualDisplay = document.getElementById('manual-display');
        const manualResults = document.getElementById('manual-results-section');
        
        const settingsModal = document.getElementById('settings-modal');
        const scriptUrlInput = document.getElementById('script-url-input');
        const roomcordUrlInput = document.getElementById('roomcord-url-input');
        
        let assetsArray = []; 
        let lastScannedCode = "";
        let lastScanTime = 0;
        let manualInputString = "";
        let html5QrcodeScanner = null;

        function showMessage(msg, title = "提示") {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-content').innerText = msg;
            document.getElementById('msg-modal').style.display = 'flex';
        }

        function closeMessage() {
            document.getElementById('msg-modal').style.display = 'none';
        }

        function getDirectImageUrl(url) {
            if (!url) return "";
            url = String(url).trim();
            let match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
            return url;
        }

        function loadDatabase(apiUrl) {
            if (!apiUrl || !apiUrl.includes("script.google.com")) {
                showMessage("請輸入正確的 Google Apps Script 網址！", "設定錯誤");
                return;
            }

            statusBar.style.display = 'block';
            statusBar.innerHTML = "🔄 正在連線下載跨工作表資料...";
            statusBar.style.background = "rgba(0,0,0,0.8)";
            
            assetsArray = []; 
            
            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) throw new Error("網路連線異常");
                    return response.json();
                })
                .then(data => {
                    assetsArray = data.map(row => ({
                        assetId: row.assetId,
                        scanCode: row.scanCode,
                        name: row.name,
                        location: row.location,
                        image: getDirectImageUrl(row.image)
                    }));

                    if (assetsArray.length > 0) {
                        statusBar.innerHTML = `✅ 資料載入完成 (共跨表整合 ${assetsArray.length} 筆)`;
                        setTimeout(() => statusBar.style.display = 'none', 4000);
                        
                        if (!html5QrcodeScanner) startScanner(); 
                    } else {
                        statusBar.innerHTML = `⚠️ 下載成功，但試算表內無有效資料`;
                        statusBar.style.background = "rgba(255, 152, 0, 0.9)";
                    }
                })
                .catch(error => {
                    statusBar.innerHTML = "❌ 資料載入失敗，請檢查網址或發布權限";
                    statusBar.style.background = "rgba(211, 47, 47, 0.9)";
                    console.error("Fetch error:", error);
                });
        }

        function openSettings() {
            scriptUrlInput.value = localStorage.getItem('sng_script_url') || "";
            roomcordUrlInput.value = localStorage.getItem('sng_roomcord_url') || "";
            settingsModal.style.display = 'flex';
        }

        function closeSettings() {
            settingsModal.style.display = 'none';
        }

        function saveSettings() {
            const newScriptUrl = scriptUrlInput.value.trim();
            const newRoomcordUrl = roomcordUrlInput.value.trim();
            
            if (newScriptUrl) {
                localStorage.setItem('sng_script_url', newScriptUrl);
                localStorage.setItem('sng_roomcord_url', newRoomcordUrl);
                closeSettings();
                loadDatabase(newScriptUrl); 
            } else {
                showMessage("Apps Script 網址不能為空！", "警告");
            }
        }

        window.onload = function() {
            const savedUrl = localStorage.getItem('sng_script_url');
            if (savedUrl) {
                loadDatabase(savedUrl);
            } else {
                openSettings();
            }
        };

        function playBeep(isSuccess) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = isSuccess ? 'sine' : 'sawtooth';
            osc.frequency.setValueAtTime(isSuccess ? 1500 : 250, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (isSuccess ? 0.1 : 0.3));
            osc.stop(audioCtx.currentTime + (isSuccess ? 0.1 : 0.3));
        }

        function renderAssetDetail(asset, mode) {
            const imgHtml = asset.image 
                ? `<img src="${asset.image}" alt="資產照片">` 
                : `<div style="width:100%; height:150px; background:#e0e0e0; display:flex; align-items:center; justify-content:center; border-radius:8px; color:#888;">無提供照片</div>`;
            
            let btnHtml = '';
            if (mode === 'scan') {
                btnHtml = `
                <div class="action-btn-group">
                    <button class="action-btn btn-check" id="btn-check-${asset.assetId}" onclick="clickCheck('${asset.assetId}')">盤點</button>
                    <button class="action-btn btn-roomcord" onclick="clickCopyAndOpen('${asset.assetId}')">複製後開啟房間</button>
                </div>`;
            } else {
                btnHtml = `
                <div class="action-btn-group">
                    <button class="action-btn btn-clear" onclick="clickClear()">清除</button>
                    <button class="action-btn btn-check" id="btn-check-${asset.assetId}" onclick="clickCheck('${asset.assetId}')">盤點</button>
                    <button class="action-btn btn-roomcord" onclick="clickCopyAndOpen('${asset.assetId}')">複製後開啟房間</button>
                </div>`;
            }

            return `
                <div class="asset-img-container">${imgHtml}</div>
                <div class="asset-id">資產編號: ${asset.assetId}</div>
                <div class="asset-id" style="font-size:12px; margin-bottom:10px;">掃描條碼: ${asset.scanCode || '無'}</div>
                <div class="asset-name">${asset.name}</div>
                <div class="asset-location">📍 置放地點: ${asset.location}</div>
                ${btnHtml}
            `;
        }

        function clickClear() {
            manualInputString = "";
            manualDisplay.innerHTML = '<span class="display-placeholder">請輸入資產編號 (12碼)</span>';
            manualResults.innerHTML = '<div class="hint-msg">輸入前 4 碼開始篩選</div>';
        }

        function clickCheck(assetId) {
            const apiUrl = localStorage.getItem('sng_script_url');
            if (!apiUrl) {
                showMessage("請先至右上角 ⚙️ 設定系統 API 網址！", "提示");
                return;
            }

            const now = new Date();
            const timeString = now.toLocaleString('zh-TW', { hour12: false });
            const btn = document.getElementById(`btn-check-${assetId}`);
            
            if (btn) {
                btn.innerText = "寫入中...";
                btn.classList.add('btn-disabled');
                btn.disabled = true;
            }

            const requestUrl = `${apiUrl}?action=updateTime&assetId=${encodeURIComponent(assetId)}&time=${encodeURIComponent(timeString)}`;

            fetch(requestUrl)
                .then(response => response.text())
                .then(data => {
                    if (data === "Success") {
                        playBeep(true);
                        if (btn) {
                            btn.innerText = "✅ 已盤點";
                            btn.style.background = "#2e7d32";
                        }
                    } else {
                        throw new Error(data);
                    }
                })
                .catch(error => {
                    showMessage("❌ 盤點寫入失敗，請確認該表單具有「盤點時間」欄位。\n詳細錯誤: " + error.message, "寫入錯誤");
                    if (btn) {
                        btn.innerText = "盤點";
                        btn.classList.remove('btn-disabled');
                        btn.disabled = false;
                    }
                });
        }

        function clickCopyAndOpen(assetId) {
            const textToCopy = `資產ID：${assetId}，位置：`;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    executeRoomcordRedirect();
                }).catch(err => {
                    fallbackCopyTextToClipboard(textToCopy);
                });
            } else {
                fallbackCopyTextToClipboard(textToCopy);
            }
        }

        function executeRoomcordRedirect() {
            const roomcordUrl = localStorage.getItem('sng_roomcord_url');
            if (roomcordUrl) {
                window.location.href = roomcordUrl;
            } else {
                showMessage("✅ 已複製資產資訊！\n\n(提示：尚未設定 Roomcord 連結，無法跳轉，請至右上角 ⚙️ 設定)", "複製成功");
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    executeRoomcordRedirect();
                } else {
                    showMessage("❌ 複製失敗，請手動複製", "錯誤");
                }
            } catch (err) {
                showMessage("❌ 您的瀏覽器不支援複製", "錯誤");
            }
            document.body.removeChild(textArea);
        }

        function onScanSuccess(decodedText) {
            if (document.getElementById('scan-container').style.display === 'none' || assetsArray.length === 0) return;

            const currentTime = new Date().getTime();
            if (decodedText === lastScannedCode && (currentTime - lastScanTime) < 1500) return; 
            lastScannedCode = decodedText;
            lastScanTime = currentTime;

            const scanIdStr = String(decodedText).trim();
            const asset = assetsArray.find(a => a.scanCode === scanIdStr);

            infoSection.classList.add('success-flash');
            setTimeout(() => infoSection.classList.remove('success-flash'), 300);

            if (asset) {
                playBeep(true);
                infoSection.innerHTML = renderAssetDetail(asset, 'scan');
            } else {
                playBeep(false);
                infoSection.innerHTML = `
                    <div class="error-msg">❌ 查無此設備</div>
                    <div class="asset-id" style="margin-top:10px; text-align:center;">未知掃描內容: ${scanIdStr}</div>
                `;
            }
        }

        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 15, qrbox: { width: 280, height: 120 }, aspectRatio: 1.0, videoConstraints: { facingMode: "environment" } }, false
            );
            html5QrcodeScanner.render(onScanSuccess);
        }

        function switchMode(mode) {
            if (mode === 'scan') {
                document.getElementById('btn-scan').classList.add('active');
                document.getElementById('btn-manual').classList.remove('active');
                document.getElementById('scan-container').style.display = 'flex';
                document.getElementById('manual-container').style.display = 'none';
            } else {
                document.getElementById('btn-manual').classList.add('active');
                document.getElementById('btn-scan').classList.remove('active');
                document.getElementById('manual-container').style.display = 'flex';
                document.getElementById('scan-container').style.display = 'none';
                
                clickClear(); 
            }
        }

        function pressKey(key) {
            if (assetsArray.length === 0) {
                showMessage("請先點擊右上角設定系統連線！", "提示");
                return;
            }

            if (key === 'delete') {
                manualInputString = manualInputString.slice(0, -1);
            } else if (key === 'confirm') {
                updateManualResults(true); 
                return;
            } else {
                if (manualInputString.length < 12) { 
                    manualInputString += key;
                }
            }
            
            if (manualInputString.length === 0) {
                manualDisplay.innerHTML = '<span class="display-placeholder">請輸入資產編號 (12碼)</span>';
            } else {
                manualDisplay.innerText = manualInputString;
            }
            updateManualResults(false);
        }

        function updateManualResults(isConfirm) {
            if (manualInputString.length < 4) {
                manualResults.innerHTML = '<div class="hint-msg">輸入前 4 碼開始篩選</div>';
                manualResults.classList.remove('success-flash');
                return;
            }

            const matches = assetsArray.filter(a => a.assetId.startsWith(manualInputString));

            if (matches.length === 0) {
                manualResults.innerHTML = '<div class="error-msg">❌ 查無字首相符的設備</div>';
                return;
            }

            const exactMatch = matches.find(a => a.assetId === manualInputString);
            if (exactMatch && (isConfirm || manualInputString.length === 12)) {
                playBeep(true);
                manualResults.classList.add('success-flash');
                setTimeout(() => manualResults.classList.remove('success-flash'), 300);
                manualResults.innerHTML = `<div style="padding-top:10px; display:flex; flex-direction:column; align-items:center;">${renderAssetDetail(exactMatch, 'manual')}</div>`;
            } 
            else {
                let html = matches.map(asset => `
                    <div class="list-item" onclick="selectFromList('${asset.assetId}')">
                        <div class="list-id">${asset.assetId}</div>
                        <div class="list-name">${asset.name}</div>
                    </div>
                `).join('');
                manualResults.innerHTML = html;
                manualResults.classList.remove('success-flash');
            }
        }

        function selectFromList(assetId) {
            manualInputString = assetId; 
            manualDisplay.innerText = manualInputString;
            updateManualResults(true); 
        }
    </script>
</body>
</html>
