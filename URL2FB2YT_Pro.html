<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>SNG 直播連續播放控制台 Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #000; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden; 
        }
        #video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            flex-shrink: 0;
            z-index: 10;
            position: relative;
            touch-action: pan-y;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        /* Facebook SDK 嵌入後的 iframe 也要滿版 */
        #video-wrapper .fb-video,
        #video-wrapper .fb-video iframe {
            width: 100% !important;
            height: 100% !important;
        }
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.3s;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #0a84ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text {
            margin-top: 12px;
            font-size: 14px;
            color: #aaa;
        }
        #info-section {
            flex-grow: 1;
            padding: 15px;
            padding-bottom: 120px;
            background: #111;
            overflow-y: auto;
            touch-action: pan-y; 
        }
        #vid-title {
            margin: 0 0 5px 0;
            font-size: 18px;
            line-height: 1.3;
            word-break: break-word;
        }
        #vid-channel {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tag-fb {
            display: inline-block;
            background: #1877f2;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            vertical-align: middle;
            font-weight: 600;
        }
        .tag-yt {
            display: inline-block;
            background: #ff0000;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            vertical-align: middle;
            font-weight: 600;
        }
        #vid-desc {
            background: #222;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
            white-space: pre-wrap; 
            word-break: break-word;
        }
        .desc-meta {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #333;
        }
        #controls { 
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            min-height: 90px; 
            background: rgba(28, 28, 30, 0.95); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-sizing: border-box; 
            padding: 10px 15px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
            gap: 10px; 
            z-index: 100;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5); 
        }
        button { 
            flex: 1; 
            height: 52px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            border: none; 
            border-radius: 12px; 
            background: #0a84ff; 
            color: white; 
            touch-action: manipulation; 
            transition: transform 0.1s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        button:active { 
            background: #0060d1; 
            transform: scale(0.97);
        }
        button:disabled { 
            background: #3a3a3c; 
            color: #8e8e93;
            cursor: not-allowed; 
            transform: none;
        }
        .btn-icon {
            font-size: 18px;
        }
        #status { 
            font-size: 14px; 
            font-weight: 600;
            color: #ebebf5;
            white-space: nowrap; 
            text-align: center;
            min-width: 70px;
            background: #2c2c2e;
            padding: 8px 12px;
            border-radius: 10px;
        }
        #action-bar {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            z-index: 50;
        }
        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            border: none;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: none;
        }
        #prompt-panel {
            position: fixed;
            top: 0;
            right: -100%; 
            width: 85%;
            max-width: 400px;
            height: 100dvh;
            background: rgba(28, 28, 30, 0.98);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: -5px 0 20px rgba(0,0,0,0.7);
            transition: right 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 200; 
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        }
        #prompt-panel.open {
            right: 0;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .panel-header h3 {
            margin: 0;
            font-size: 18px;
        }
        .close-btn {
            background: #3a3a3c;
            height: 36px;
            flex: 0 0 70px;
            font-size: 14px;
        }
        #requirement-input {
            flex-grow: 1;
            margin-bottom: 15px;
            background: #000;
            color: #fff;
            border: 1px solid #3a3a3c;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            outline: none;
            font-family: inherit;
        }
        #copy-prompt-btn {
            background: #32d74b;
            flex: 0 0 56px;
            font-size: 16px;
            transition: background 0.2s;
        }
        #copy-prompt-btn:active { background: #28a745; }
        #swipe-hint {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(50, 50, 50, 0.7);
            color: #fff;
            padding: 15px 5px;
            border-radius: 8px 0 0 8px;
            z-index: 50;
            font-size: 12px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(40, 40, 40, 0.95);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            backdrop-filter: blur(5px);
            text-align: center;
            max-width: 80%;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .error-box {
            background: #3a1a1a;
            border: 1px solid #ff453a;
            color: #ff453a;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 10px;
        }
        .hint-text {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            line-height: 1.4;
        }
        /* 影片縮圖預覽 */
        .video-thumb {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            z-index: 5;
            transition: opacity 0.3s;
        }
        .video-thumb.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="video-wrapper">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="loading-text">載入中...</div>
        </div>
    </div>

    <div id="action-bar">
        <button class="action-btn" onclick="copyCurrentLink()" title="複製連結">🔗</button>
        <button class="action-btn" onclick="toggleFullscreen()" title="全螢幕">⛶</button>
    </div>

    <div id="swipe-hint" onclick="togglePanel(true)">◀ 品管</div>

    <div id="info-section">
        <h3 id="vid-title">載入影片資訊中...</h3>
        <p id="vid-channel">頻道名稱</p>
        <div id="vid-desc">載入內文中...</div>
    </div>

    <div id="controls">
        <button id="prev-btn" onclick="changeVideo(-1)">
            <span class="btn-icon">◄</span> 上一部
        </button>
        <div id="status">等待中</div>
        <button id="next-btn" onclick="changeVideo(1)">
            下一部 <span class="btn-icon">►</span>
        </button>
    </div>

    <!-- 品管設定面板 -->
    <div id="prompt-panel">
        <div class="panel-header">
            <h3>📝 發稿比對設定</h3>
            <button class="close-btn" onclick="togglePanel(false)">收合</button>
        </div>
        <textarea id="requirement-input" placeholder="請貼上您的品管需求單..."></textarea>
        <button id="copy-prompt-btn" onclick="copyToGemini()">📋 複製發稿比對內容</button>
        <div class="hint-text">
            💡 提示：若 Facebook 影片無法自動抓取資訊，請在捷徑中一併傳入 fb_meta 參數。
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Facebook SDK -->
    <div id="fb-root"></div>
    <script>
        window.fbAsyncInit = function() {
            FB.init({ xfbml: true, version: 'v19.0' });
        };
        (function(d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            js.src = "https://connect.facebook.net/zh_TW/sdk.js#xfbml=1&version=v19.0";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'facebook-jssdk'));
    </script>

    <script>
        const API_KEY = 'AIzaSyCD8fnx7T0aEpPG2Co5p4QDqshIgB_ix1Y'; 

        let mediaList = [];
        let currentIndex = 0;
        let ytInfoMap = {};      // id -> snippet
        let fbInfoMap = {};      // url -> {title, description, channel}
        let isPanelOpen = false;

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawText = urlParams.get('text');
            const fbMetaRaw = urlParams.get('fb_meta');

            // 解析 Facebook 預設中繼資料（由捷徑傳入）
            if (fbMetaRaw) {
                try {
                    const fbMetaList = JSON.parse(decodeURIComponent(fbMetaRaw));
                    fbMetaList.forEach(item => {
                        if (item.url) {
                            fbInfoMap[item.url] = {
                                title: item.title || '',
                                description: item.desc || item.description || '',
                                channel: item.channel || ''
                            };
                        }
                    });
                } catch (e) {
                    console.warn('fb_meta 解析失敗', e);
                }
            }

            if (rawText) {
                const rawTextDecoded = decodeURIComponent(rawText);

                // 1. YouTube
                const ytRegExp = /(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|live\/|shorts\/)([a-zA-Z0-9_-]{11})/g;
                const ytMatches = [...rawTextDecoded.matchAll(ytRegExp)];
                ytMatches.forEach(match => {
                    if (!mediaList.some(item => item.id === match[1])) {
                        mediaList.push({ type: 'youtube', id: match[1] });
                    }
                });

                // 2. Facebook
                const fbRegExp = /https:\/\/(?:www\.)?facebook\.com\/[^\s/]+\/videos\/\d+\/?/g;
                const fbMatches = [...rawTextDecoded.matchAll(fbRegExp)];
                fbMatches.forEach(match => {
                    if (!mediaList.some(item => item.url === match[0])) {
                        mediaList.push({ type: 'facebook', url: match[0] });
                    }
                });

                if (mediaList.length > 0) {
                    // 嘗試讀取上次播放位置
                    const savedIndex = localStorage.getItem('sng_player_last_index');
                    const startIndex = (savedIndex !== null && parseInt(savedIndex) < mediaList.length) 
                        ? parseInt(savedIndex) : 0;

                    loadVideo(startIndex); 
                    fetchAllData(); 
                    setupGestures(); 
                    setupKeyboard();
                } else {
                    showError('找不到支援的影片', '請確認複製的文字中是否包含 YouTube 或 Facebook 影片連結。');
                }
            } else {
                showError('無輸入', '請透過捷徑傳入網址');
            }
        }

        function showLoading(text) {
            const overlay = document.getElementById('loading-overlay');
            document.getElementById('loading-text').innerText = text || '載入中...';
            overlay.classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        function showError(title, message) {
            document.getElementById('status').innerText = '錯誤';
            document.getElementById('vid-title').innerText = title;
            document.getElementById('vid-channel').innerText = '';
            document.getElementById('vid-desc').innerHTML = `<div class="error-box">${message}</div>`;
            hideLoading();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function loadVideo(index) {
            if (index < 0 || index >= mediaList.length) return;
            currentIndex = index;
            localStorage.setItem('sng_player_last_index', currentIndex);

            const currentMedia = mediaList[currentIndex];
            const wrapper = document.getElementById('video-wrapper');

            // 保留 loading overlay，清除其他內容
            const overlay = document.getElementById('loading-overlay');
            wrapper.innerHTML = '';
            wrapper.appendChild(overlay);
            showLoading('載入影片中...');

            // 更新底部狀態
            document.getElementById('status').innerText = `${currentIndex + 1} / ${mediaList.length}`;
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === mediaList.length - 1);

            // 重置資訊區
            document.getElementById('vid-title').innerHTML = currentMedia.type === 'youtube' 
                ? '<span class="tag-yt">YouTube</span>載入影片資訊中...'
                : '<span class="tag-fb">Facebook</span>載入影片資訊中...';
            document.getElementById('vid-channel').innerText = '';
            document.getElementById('vid-desc').innerText = '抓取內文中...';

            if (currentMedia.type === 'youtube') {
                loadYouTube(currentMedia, wrapper);
            } else {
                loadFacebook(currentMedia, wrapper);
            }
        }

        function loadYouTube(media, wrapper) {
            // 靜音自動播放：autoplay=1 + mute=1（iOS/Chrome 政策要求）
            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube.com/embed/${media.id}?autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1`;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.onload = () => hideLoading();
            wrapper.appendChild(iframe);

            // 嘗試從已抓取資料顯示
            if (ytInfoMap[media.id]) {
                updateYouTubeInfo(ytInfoMap[media.id]);
            } else {
                // 即時抓取單筆
                fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${media.id}&key=${API_KEY}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.items && data.items.length > 0) {
                            ytInfoMap[media.id] = data.items[0].snippet;
                            updateYouTubeInfo(data.items[0].snippet);
                        } else {
                            document.getElementById('vid-title').innerHTML = '<span class="tag-yt">YouTube</span>（無法取得影片資訊）';
                            document.getElementById('vid-desc').innerText = '此影片可能已下架或為私人影片。';
                        }
                    })
                    .catch(err => {
                        console.error('YT API 錯誤:', err);
                        document.getElementById('vid-title').innerHTML = '<span class="tag-yt">YouTube</span>（載入失敗）';
                    });
            }
        }

        function updateYouTubeInfo(snippet) {
            document.getElementById('vid-title').innerHTML = `<span class="tag-yt">YouTube</span>${snippet.title}`;
            document.getElementById('vid-channel').innerText = snippet.channelTitle;
            document.getElementById('vid-desc').innerText = snippet.description || '（此影片無提供內文）';
        }

        function loadFacebook(media, wrapper) {
            // 使用 Facebook SDK 嵌入（支援 data-autoplay）
            const fbDiv = document.createElement('div');
            fbDiv.className = 'fb-video';
            fbDiv.setAttribute('data-href', media.url);
            fbDiv.setAttribute('data-width', 'auto');
            fbDiv.setAttribute('data-show-text', 'false');
            fbDiv.setAttribute('data-autoplay', 'true');
            fbDiv.setAttribute('data-allowfullscreen', 'true');
            fbDiv.setAttribute('data-lazy', 'false');
            fbDiv.style.width = '100%';
            fbDiv.style.height = '100%';
            wrapper.appendChild(fbDiv);

            // 嘗試解析嵌入
            function tryParse() {
                if (typeof FB !== 'undefined' && FB.XFBML && FB.XFBML.parse) {
                    FB.XFBML.parse(wrapper, () => hideLoading());
                } else {
                    setTimeout(tryParse, 300);
                }
            }
            tryParse();

            // 載入資訊：先檢查 fb_meta，再嘗試 noembed fallback
            const meta = fbInfoMap[media.url];
            if (meta && meta.title) {
                updateFacebookInfo(meta);
            } else {
                // 嘗試 noembed（成功率有限，但免費）
                fetch(`https://noembed.com/embed?url=${encodeURIComponent(media.url)}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.title) {
                            const info = {
                                title: data.title,
                                description: data.description || '',
                                channel: data.author_name || ''
                            };
                            fbInfoMap[media.url] = info;
                            updateFacebookInfo(info);
                        } else {
                            throw new Error('noembed 無資料');
                        }
                    })
                    .catch(() => {
                        // 最終 fallback
                        updateFacebookInfo({
                            title: 'Facebook 影音直播',
                            description: '⚠️ 注意：\nFacebook 不開放前端自動抓取貼文內容。\n\n若需比對標題與內文，建議：\n1. 修改捷徑傳入 fb_meta 參數\n2. 或直接至原貼文複製',
                            channel: ''
                        });
                    });
            }
        }

        function updateFacebookInfo(info) {
            document.getElementById('vid-title').innerHTML = `<span class="tag-fb">Facebook</span>${info.title || 'Facebook 影音'}`;
            document.getElementById('vid-channel').innerText = info.channel || '（受限於 FB 隱私政策，無法自動抓取頻道名稱）';
            document.getElementById('vid-desc').innerText = info.description || '（無內文）';
        }

        function changeVideo(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < mediaList.length) {
                loadVideo(newIndex);
            }
        }

        function togglePanel(show) {
            const panel = document.getElementById('prompt-panel');
            isPanelOpen = show;
            if (show) panel.classList.add('open');
            else panel.classList.remove('open');
        }

        function setupGestures() {
            let touchStartX = 0;
            let touchStartY = 0;
            const swipeArea = document.getElementById('info-section');
            const videoArea = document.getElementById('video-wrapper');

            // 資訊區：上下滑動開啟/關閉品管面板（原有功能）
            swipeArea.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            swipeArea.addEventListener('touchend', e => {
                const dx = touchStartX - e.changedTouches[0].screenX;
                const dy = touchStartY - e.changedTouches[0].screenY;
                // 水平滑動開啟/關閉面板
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                    if (dx > 0) togglePanel(true);
                    else togglePanel(false);
                }
            }, { passive: true });

            // 影片區：左右滑動切換影片
            videoArea.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            videoArea.addEventListener('touchend', e => {
                const dx = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(dx) > 60) {
                    if (dx > 0) changeVideo(1);  // 左滑 -> 下一部
                    else changeVideo(-1);          // 右滑 -> 上一部
                }
            }, { passive: true });
        }

        function setupKeyboard() {
            document.addEventListener('keydown', e => {
                if (isPanelOpen) return; // 面板開啟時不觸發
                if (e.key === 'ArrowLeft') changeVideo(-1);
                if (e.key === 'ArrowRight') changeVideo(1);
                if (e.key === 'f' || e.key === 'F') toggleFullscreen();
            });
        }

        async function fetchAllData() {
            // 背景批次抓取所有 YouTube 資料
            const ytIds = mediaList.filter(m => m.type === 'youtube').map(m => m.id);
            if (ytIds.length === 0) return;

            const idsString = ytIds.join(',');
            try {
                const response = await fetch(
                    `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${idsString}&key=${API_KEY}`
                );
                const data = await response.json();
                if (data.items) {
                    data.items.forEach(item => {
                        ytInfoMap[item.id] = item.snippet;
                    });
                    // 如果當前是 YouTube 且還沒更新，更新它
                    const current = mediaList[currentIndex];
                    if (current.type === 'youtube' && ytInfoMap[current.id]) {
                        updateYouTubeInfo(ytInfoMap[current.id]);
                    }
                }
            } catch (error) {
                console.error('背景批次抓取失敗', error);
            }
        }

        function copyCurrentLink() {
            const media = mediaList[currentIndex];
            let url = '';
            if (media.type === 'youtube') {
                url = `https://youtu.be/${media.id}`;
            } else {
                url = media.url;
            }
            navigator.clipboard.writeText(url).then(() => {
                showToast('已複製影片連結');
            }).catch(() => {
                showToast('複製失敗，請手動複製');
            });
        }

        function toggleFullscreen() {
            const wrapper = document.getElementById('video-wrapper');
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
            } else {
                document.exitFullscreen?.() || document.webkitExitFullscreen?.();
            }
        }

        function copyToGemini() {
            const media = mediaList[currentIndex];
            const requirement = document.getElementById('requirement-input').value.trim();
            const reqText = requirement || '（未輸入發稿需求）';

            let title, desc, channel;

            if (media.type === 'youtube') {
                const info = ytInfoMap[media.id];
                title = info?.title || '（無標題）';
                desc = info?.description || '（無內文）';
                channel = info?.channelTitle || '（無頻道資訊）';
            } else {
                const info = fbInfoMap[media.url];
                title = info?.title || '（無法自動抓取 FB 標題，請參照原發稿文字）';
                desc = info?.description || '（無法自動抓取 FB 內文，請參照原發稿文字）';
                channel = info?.channel || '（無法自動抓取 FB 頻道）';
            }

            const finalPrompt = `你現在是一位嚴格的發稿與轉播品管編輯。

請根據下方的【發稿需求單】，嚴格比對這場直播的【標題】與【內文】。
你的唯一任務是：檢查是否有遺漏需求中的關鍵字、格式錯誤，或不合邏輯的地方。

⚠️ 絕對禁止：
1. 不要對新聞內容做任何總結或摘要！
2. 如果完全符合規範，請直接回覆「符合規範，無須修改」，不用廢話。
3. 如果有錯，請直接明確指出哪裡不符合需求。

====================
【發稿需求單】：
${reqText}

====================
【頻道】：${channel}

【標題】：${title}

【內文】：
${desc}`;

            navigator.clipboard.writeText(finalPrompt).then(() => {
                showToast('✅ 已複製！請貼給 Gemini');
            }).catch(err => {
                console.error('複製失敗', err);
                alert('剪貼簿權限遭阻擋，請手動全選文字複製。');
            });
        }

        init();
    </script>
</body>
</html>
